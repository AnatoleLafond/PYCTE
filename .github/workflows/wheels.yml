# Builds the pycte wheels (with ORCHESTRA and xGEMS compiled, see setup.py) for Windows, Linux and macOS, Python 3.11
# to 3.14, and the sdist. On a GitHub release, uploads them to PyPI (trusted publishing, to be set once on pypi.org:
# project pycte > Publishing > GitHub, workflow wheels.yml, environment pypi).
name: wheels

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5         # options in [tool.cibuildwheel] of pyproject.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: github.event_name == 'release'
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.3
